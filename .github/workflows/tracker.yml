name: Islandking Login & Tracker
on:
  workflow_dispatch: # Manueller Fallback-Start im GitHub-Web
  # Seit 2026-09-10 laeuft der Dauerbetrieb auf einer eigenen
  # bot-hosting.net-Instanz (s. tracker.py: run_forever()) - schedule/
  # repository_dispatch (cron-job.org) entfernt, sonst wuerde parallel zum
  # Dauerlauf zusaetzlich hier ausgeloest und doppelt geschrieben/eingeloggt.
  # Bei Bedarf (Instanz down) einfach ueber "Run workflow" manuell starten.

jobs:
  track:
    runs-on: ubuntu-latest
    # Kein "permissions: contents: write" mehr noetig - nichts schreibt
    # mehr ueber den automatischen GITHUB_TOKEN, tracker.py schreibt
    # ausschliesslich per DATA_REPO_TOKEN ueber die Contents-API.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Kein zweiter Checkout des privaten Daten-Repos mehr noetig -
        # tracked_users.json laeuft seit 2026-09-10 wie history.json
        # komplett ueber die GitHub-Contents-API (s. tracker.py), kein
        # lokaler Checkout/Commit/Push dafuer mehr.

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: pip install requests
        # Playwright wurde entfernt: weder das alte noch das neue Skript
        # nutzen einen Browser, nur reine HTTP-Requests (requests-Bibliothek).
        # Spart deutlich Zeit und GitHub-Actions-Minuten pro Lauf.

      - name: WireGuard-VPN verbinden (Windscribe)
        run: |
          sudo apt-get install -y wireguard-tools || (sudo apt-get update -qq && sudo apt-get install -y wireguard-tools)
          umask 077
          echo "${{ secrets.WG_CONFIG }}" > /tmp/wg0.conf
          sudo mv /tmp/wg0.conf /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
        # Feste Windscribe-Exit-IP statt der bei jedem Actions-Run neuen
        # Azure-Runner-IP, damit Islandking den haeufigen Login-Takt (alle
        # 2 Min. per cron-job.org) nicht als 600+ verschiedene IPs sieht.
        # apt-get update nur im Fallback (Paket-Cache des Runner-Images
        # reicht normalerweise), spart ein paar Sekunden pro Lauf - die
        # 2-Minuten-Taktung des Cron-Triggers lässt kaum Marge.

      - name: Tracker mit Login ausführen
        env:
          IK_USER: ${{ secrets.IK_USER }}
          IK_PASS: ${{ secrets.IK_PASS }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          # Wird fuer den tracked_users.json/history.json-Zugriff ueber die
          # GitHub-Contents-API im privaten Daten-Repo gebraucht.
          RUN_ONCE: "1"
          # Seit 2026-09-10 laeuft der Dauerbetrieb auf einer eigenen
          # bot-hosting.net-Instanz (tracker.py laeuft dort per Default als
          # Endlos-Loop, s. run_forever()) - dieser Workflow ist nur noch
          # manueller Fallback. Ohne RUN_ONCE=1 wuerde tracker.py hier NIE
          # beenden und den Runner bis zum 6h-Timeout blockieren.
        run: python tracker.py

      - name: WireGuard-VPN trennen
        if: always()
        run: sudo wg-quick down wg0 || true
        # Sauber trennen, unabhaengig davon, ob tracker.py erfolgreich war.
        # Kein Commit/Push-Schritt mehr danach - tracker.py schreibt
        # tracked_users.json UND history.json seit 2026-09-10 direkt selbst
        # ueber die GitHub-Contents-API (push_tracked()/sync_history()).
