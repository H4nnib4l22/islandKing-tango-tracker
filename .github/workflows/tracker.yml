name: Islandking Login & Tracker
on:
  schedule:
    - cron: '0 */6 * * *' # Bleibt für den automatischen GitHub-Intervall erhalten (z.B. alle 6 Stunden)
  workflow_dispatch: # Ermöglicht den manuellen Start im GitHub-Web
  repository_dispatch:
    types: [run-tracker] # Das ist das Signal, auf das cron-job.org hören wird

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: pip install requests
        # Playwright wurde entfernt: weder das alte noch das neue Skript
        # nutzen einen Browser, nur reine HTTP-Requests (requests-Bibliothek).
        # Spart deutlich Zeit und GitHub-Actions-Minuten pro Lauf.

      - name: Tracker mit Login ausführen
        env:
          IK_USER: ${{ secrets.IK_USER }}
          IK_PASS: ${{ secrets.IK_PASS }}
        run: python tracker.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update tracked_users.json"
          git push
        # (Vorher gab es hier zwei fast identische Commit-Schritte
        # hintereinander - der zweite lief faktisch nie, da nach dem
        # ersten committeten Schritt nichts mehr offen war. Zu einem
        # zusammengefasst.)
