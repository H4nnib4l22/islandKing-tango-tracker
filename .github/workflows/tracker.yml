name: Islandking Login & Tracker
on:
  schedule:
    - cron: '0 */6 * * *' # Bleibt für den automatischen GitHub-Intervall erhalten (z.B. alle 6 Stunden)
  workflow_dispatch: # Ermöglicht den manuellen Start im GitHub-Web
  repository_dispatch:
    types: [run-tracker] # Das ist das Signal, auf das cron-job.org hören wird

concurrency:
  group: tracker-run
  cancel-in-progress: false
  # Verhindert, dass sich zwei Laeufe ueberlappen (cron-job.org triggert alle
  # 2 Min. per repository_dispatch) - ohne das koennten zwei parallele Runs
  # sich beim Schreiben von tracked_users.json gegenseitig ueberschreiben.
  # history.json ist seit dem API-basierten Merge (sync_history in
  # tracker.py) davon nicht mehr betroffen, tracked_users.json laeuft aber
  # weiterhin ueber lokalen Git-Commit.

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout data repository (privat)
        uses: actions/checkout@v4
        with:
          repository: H4nnib4l22/islandKing-tango-tracker-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
        # Privates Repo, daher eigener Token (der automatische GITHUB_TOKEN
        # hat nur Zugriff auf das Repo, in dem der Workflow laeuft). Landet
        # exakt im "data/"-Pfad, den tracker.py schon immer erwartet hat -
        # dort aendert sich dadurch nichts.

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: pip install requests
        # Playwright wurde entfernt: weder das alte noch das neue Skript
        # nutzen einen Browser, nur reine HTTP-Requests (requests-Bibliothek).
        # Spart deutlich Zeit und GitHub-Actions-Minuten pro Lauf.

      - name: Tracker mit Login ausführen
        env:
          IK_USER: ${{ secrets.IK_USER }}
          IK_PASS: ${{ secrets.IK_PASS }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          # Wird fuer den history.json-Merge ueber die GitHub-Contents-API
          # im privaten Daten-Repo gebraucht (sync_history in tracker.py).
        run: python tracker.py

      - name: Commit and push changes (data repo)
        working-directory: data
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add tracked_users.json
          if git diff --cached --quiet; then
            echo "Keine Aenderungen an tracked_users.json."
            exit 0
          fi
          git commit -m "Update tracked_users.json"

          # Zwischen Checkout und Push kann der Remote-Branch weitergelaufen
          # sein (anderer Run, oder ein manueller/API-Commit anderswo im
          # Repo) - "fetch first" ohne Retry wuerde den ganzen Job scheitern
          # lassen. Rebase + kurzer Retry, da nur diese Datei hier bewegt
          # wird und Konflikte damit unwahrscheinlich sind.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $attempt/3), rebase gegen origin/main und erneut versuchen..."
            git pull --rebase origin main
          done
          echo "Push nach 3 Versuchen weiterhin fehlgeschlagen."
          exit 1
        # history.json wird nicht mehr hier committet - das laeuft
        # inzwischen komplett ueber die GitHub-API in tracker.py
        # (sync_history), lokal wird die Datei gar nicht mehr angefasst.
        # working-directory: data -> operiert auf dem Checkout des privaten
        # Daten-Repos, nicht auf dem oeffentlichen Code-Repo.
