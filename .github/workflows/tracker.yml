name: Islandking Login & Tracker
on:
  schedule:
    - cron: '0 */6 * * *' # Bleibt für den automatischen GitHub-Intervall erhalten (z.B. alle 6 Stunden)
  workflow_dispatch: # Ermöglicht den manuellen Start im GitHub-Web
  repository_dispatch:
    types: [run-tracker] # Das ist das Signal, auf das cron-job.org hören wird

concurrency:
  group: tracker-run
  cancel-in-progress: false
  # Verhindert, dass sich zwei Laeufe ueberlappen (cron-job.org triggert alle
  # 2 Min. per repository_dispatch) - ohne das koennten zwei parallele Runs
  # sich beim Schreiben von tracked_users.json gegenseitig ueberschreiben.
  # history.json ist seit dem API-basierten Merge (sync_history in
  # tracker.py) davon nicht mehr betroffen, tracked_users.json laeuft aber
  # weiterhin ueber lokalen Git-Commit.

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: pip install requests
        # Playwright wurde entfernt: weder das alte noch das neue Skript
        # nutzen einen Browser, nur reine HTTP-Requests (requests-Bibliothek).
        # Spart deutlich Zeit und GitHub-Actions-Minuten pro Lauf.

      - name: Tracker mit Login ausführen
        env:
          IK_USER: ${{ secrets.IK_USER }}
          IK_PASS: ${{ secrets.IK_PASS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Wird fuer den history.json-Merge ueber die GitHub-Contents-API
          # gebraucht (sync_history in tracker.py) - anders als
          # GITHUB_REPOSITORY nicht automatisch an Steps durchgereicht,
          # muss hier explizit gesetzt werden.
        run: python tracker.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/tracked_users.json
          git diff --cached --quiet || git commit -m "Update tracked_users.json"
          git push
        # history.json wird nicht mehr hier committet - das laeuft
        # inzwischen komplett ueber die GitHub-API in tracker.py
        # (sync_history), lokal wird die Datei gar nicht mehr angefasst.
